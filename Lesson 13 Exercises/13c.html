<!DOCTYPE html>
<html lang="en">

          </div>

          Hey there! We're writing to tell you about our...

        </div>

      </div>

      <div class="profile-container">

        </div>

          <div class="profile-info-title">

          </div>

          <div class="profile-text">
          Thank you for shopping at Best Buy, here is...

        </div>

        <div class="profile-picture-container">
          <img src="images/cat1.jpg" alt="" class="profile-picture">
        </div>

        <div class="profile-info-container">
          <div class="profile-info-title">
            Netflix

            <div class="profile-time">9:00 AM</div>

          </div>

          <div class="profile-info-subtitle">
            Here's what's coming soon to Netflix

        </div>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitter Post</title>

  <link rel="stylesheet" href="styles/13f-g.css">
</head>
<body>

  <div class="twitter-container">
    <img src="images/cat1.jpg" alt="" class="profile-picture">

    <div class="twitter-info-container">
      <div class="name-handle">
           <div class="twitter-username">supersimple.dev</div>
          <div class="twitter-username-handle">@SuperSimpleDev</div>
      </div>

      <div class="twitter-text">
        What is backend web development? A complete overview.
        New video is up!
      </div>

      <div class="youtube-container">
        <div class="gray-channel"></div>

        <div class="youtube-link-text-container">
          <div class="youtube-link">youtube.com</div>
          <div class="youtube-title">Backend web development
             - a complete overview (2021)</div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>

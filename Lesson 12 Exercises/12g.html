<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Follow</title>

  <link rel="stylesheet" href="styles/12g.css">
</head>
<body>
  
<div class="container">
<div class="row">
  <img src="images/cat1.jpg" alt="" class="profile-picture">
  <div class="info">
    <p class="name">Oliver</p>
    <p class="handle">the cat</p>
    <p class="category">Popular</p>
  </div>
  <button class="follow-button">Follow</button>
</div>

<div class="row">
  <img src="images/cat2.jpg" alt="" class="profile-picture">
  <div class="info">
    <p class="name">Mimi</p>
    <p class="handle">Sleepy Cat</p>
    <p class="category">Popular</p>
  </div>
  <button class="follow-button">Follow</button>
</div>

<div class="row">
  <img src="images/dog.jpg" alt="" class="profile-picture">
  <div class="info">
    <p class="name">Rex</p>
    <p class="handle">Happy Bulldog</p>
    <p class="category">Popular</p>
  </div>
  <button class="follow-button">Follow</button>
</div>

</div>

</body>
</html>
